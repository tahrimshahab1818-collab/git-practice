<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Flexbox  Practice </title>
    
    <style>
       .container {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          flex-direction: column;
          flex-wrap: nowrap;
          gap: 10px;
          height: 300px;
          background-color: #eeeeee;
          padding: 10px;
        }
        .box {
           width: 80px;
           height: 80px;
           background-color: steelblue;
           color: white;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 24px;
        }

       .box2 {
          background-color: tomato;
          align-self: center;
       }

       .box1 {
          flex-grow: 2;
       }
      
       .box3 {
           flex-shrink: 0;
        }
    </style>
</head>
<body>
 
     <h1>My Flexbox Playground</h1>
     <div class="container">
       <div class="box">1</div>
       <div class="box">2</div>
       <div class="box">3</div>
       <div class="box">4</div>
    </div>

    
</body>
</html>
